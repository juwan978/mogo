<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="국어 모의고사">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#16171A" media="(prefers-color-scheme: dark)">
<meta name="description" content="고사성어(교재 304~337쪽)와 국어 어휘(24~47p) 뜻 모의고사 — 틀렸던 것 위주, 교재 문구 그대로">

<title>국어 뜻 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#F4F1E9; --card:#FDFCF8; --card-2:#F1EEE5;
  --ink:#1B1A17; --ink-2:#4D4B45; --ink-3:#7C7A72;
  --rule:#D9D4C6; --rule-2:#E8E4D9;
  --acc:#1F4E8C; --acc-ink:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E5F0E8;
  --bad:#B8442C; --bad-bg:#FAE8E2;
  --gold:#A67A00;
  --s:#7A2E2E; --w:#1E6B5C;
  --shadow:0 1px 2px rgba(27,26,23,.05), 0 8px 24px rgba(27,26,23,.07);
  --shadow-lift:0 2px 4px rgba(27,26,23,.08), 0 16px 40px rgba(27,26,23,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16171A; --card:#202227; --card-2:#282B31;
    --ink:#EEEDE9; --ink-2:#B5B3AC; --ink-3:#807E77;
    --rule:#373A41; --rule-2:#2C2F35;
    --acc:#6E9BDB; --acc-ink:#0E1116;
    --ok:#4FA366; --ok-bg:#16301F;
    --bad:#D9694E; --bad-bg:#331910;
    --gold:#D0A43A;
    --s:#C87B6B; --w:#4FAE98;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#16171A; --card:#202227; --card-2:#282B31;
  --ink:#EEEDE9; --ink-2:#B5B3AC; --ink-3:#807E77;
  --rule:#373A41; --rule-2:#2C2F35;
  --acc:#6E9BDB; --acc-ink:#0E1116;
  --ok:#4FA366; --ok-bg:#16301F;
  --bad:#D9694E; --bad-bg:#331910;
  --gold:#D0A43A;
  --s:#C87B6B; --w:#4FAE98;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain}
.wrap{max-width:600px; margin:0 auto; padding:16px 16px 48px; min-height:100dvh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.top{display:flex; align-items:center; gap:9px; margin-bottom:16px}
.brand{font-family:'Gowun Batang',serif; font-weight:700; font-size:20px; flex:1}
.brand span{font-family:'IBM Plex Sans KR',sans-serif; color:var(--ink-3); font-weight:400; font-size:12px; margin-left:7px}
.iconbtn{width:38px; height:38px; flex:none; border-radius:11px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink-2); font-size:16px; cursor:pointer; display:grid; place-items:center}
.iconbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.modecard:focus-visible{outline:3px solid var(--acc); outline-offset:2px}
.kicker{font-size:11.5px; font-weight:600; letter-spacing:.11em; color:var(--ink-3); margin:22px 0 9px}
.note{font-size:12.5px; color:var(--ink-3); margin-top:14px; line-height:1.6}

/* 홈 점수판 */
.board{background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow)}
.board .row{display:flex; gap:10px}
.board .cell{flex:1; min-width:0}
.board .v{font-family:'Gowun Batang',serif; font-weight:700; font-size:28px; line-height:1.1}
.board .l{font-size:11.5px; color:var(--ink-3); margin-top:3px}
.spark{display:flex; align-items:flex-end; gap:4px; height:38px; margin-top:12px}
.spark i{flex:1; background:var(--acc); border-radius:3px 3px 0 0; opacity:.8; min-height:3px}
.spark i.last{opacity:1; background:var(--gold)}
.weak{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.weak span{font-size:12px; padding:3px 9px; border-radius:99px; background:var(--bad-bg); color:var(--bad)}

.modecard{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:1px solid var(--rule); border-radius:15px; padding:14px 15px;
  box-shadow:var(--shadow); color:inherit; font:inherit; margin-bottom:9px; transition:transform .12s}
.modecard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.modecard[disabled]{opacity:.5; cursor:not-allowed; transform:none}
.modecard.main{border:2px solid var(--acc)}
.modecard .ic{width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center;
  font-size:20px; background:var(--card-2); border:1px solid var(--rule-2)}
.modecard .t{font-weight:600; font-size:15.5px}
.modecard .d{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.modecard .go{margin-left:auto; color:var(--ink-3); font-size:18px}

.btn{display:block; width:100%; padding:14px; border-radius:13px; border:none; background:var(--acc); color:var(--acc-ink);
  font:inherit; font-weight:600; font-size:15.5px; cursor:pointer}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--rule)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:9px}
.btnrow .btn{flex:1}

/* 시험지 */
.hud{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; color:var(--ink-3)}
.hud .sp{flex:1}
.hud b{color:var(--ink)}
.prog{height:6px; border-radius:99px; background:var(--rule-2); overflow:hidden; margin-bottom:14px}
.prog>i{display:block; height:100%; background:var(--acc); transition:width .35s}
.combo{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--gold); opacity:0; transition:opacity .2s}
.combo.on{opacity:1}
.paper{background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:18px 18px 16px; box-shadow:var(--shadow)}
.qhead{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.qno{font-family:'Gowun Batang',serif; font-weight:700; font-size:22px}
.src{font-size:11px; padding:2px 8px; border-radius:99px; color:#fff}
.src.s{background:var(--s)} .src.w{background:var(--w)}
.pt{margin-left:auto; font-size:12px; color:var(--ink-3)}
.stem{font-weight:600; font-size:16px; line-height:1.6; text-wrap:pretty}
.box{margin-top:11px; border:1px solid var(--rule); border-radius:10px; padding:11px 13px; background:var(--card-2);
  font-size:15px; line-height:1.65}
.box .big{font-family:'Gowun Batang',serif; font-weight:700; font-size:24px}
.box .hj{font-family:'Gowun Batang',serif; color:var(--ink-2); font-size:17px; margin-left:6px}
.blank{display:inline-block; min-width:2.6em; border-bottom:2px solid var(--ink); text-align:center; color:transparent}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:11px 13px; line-height:1.55; font-size:15px;
  transition:background .15s, border-color .15s}
.opt:hover{background:var(--card-2)}
.opt .k{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-3); flex:none}
.opt .oh{font-family:'Gowun Batang',serif; color:var(--ink-2)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.explain{margin-top:14px; border-left:4px solid var(--ok); background:var(--card); border-radius:0 12px 12px 0;
  padding:12px 14px; box-shadow:var(--shadow); font-size:14px; line-height:1.6}
.explain.bad{border-left-color:var(--bad)}
.explain .h{font-weight:700; margin-bottom:4px}
.explain .rw{display:flex; gap:8px; margin-top:4px}
.explain .lb{flex:none; font-size:11.5px; color:var(--ink-3); width:4.6em; padding-top:2px}
.explain .hj{font-family:'Gowun Batang',serif}
.pop{animation:pop .35s} .shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.floatup{position:fixed; left:50%; top:38%; transform:translateX(-50%); font-family:'Gowun Batang',serif; font-weight:700;
  font-size:26px; color:var(--gold); pointer-events:none; animation:fu .9s forwards; z-index:9}
@keyframes fu{0%{opacity:0; transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0; transform:translate(-50%,-40px)}}

/* 결과 */
.result{text-align:center; padding:8px 0 4px}
.result .head{font-family:'Gowun Batang',serif; font-weight:700; font-size:22px}
.result .score{font-family:'Gowun Batang',serif; font-weight:700; font-size:64px; line-height:1.05; color:var(--acc)}
.result .score small{font-size:22px; color:var(--ink-3)}
.grade{display:inline-block; margin-top:6px; padding:4px 14px; border-radius:99px; background:var(--gold); color:#fff; font-weight:700}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0}
.stat{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:10px; text-align:center}
.stat .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px}
.stat .l{font-size:11.5px; color:var(--ink-3)}
.list{display:flex; flex-direction:column; gap:8px}
.lrow{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:10px 13px; font-size:14px; line-height:1.55; text-align:left}
.lrow .ko{font-weight:700} .lrow .hj{font-family:'Gowun Batang',serif; color:var(--ink-2); margin-left:5px}
.lrow .m{color:var(--ink-2); margin-top:2px} .lrow .g{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.empty{font-size:13.5px; color:var(--ink-3); text-align:center; padding:14px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

const GW = (readLS('eohwi-v1') || {}).rec || {};      // 국어 어휘
function pastWrong(d) {
  let w = 0, open = false;
  if (d.v2 != null && G2[d.v2]) { w += G2[d.v2].w || 0; if ((G2[d.v2].w || 0) > 0 && (G2[d.v2].s || 0) < 3) open = true; }
  (d.v1 || []).forEach(k => { if (G1[k]) { w += G1[k].w || 0; if ((G1[k].w || 0) > 0 && !G1[k].n) open = true; } });
  if (d.t === 'w' && GW[d.wid]) { w += GW[d.wid].w || 0; if ((GW[d.wid].w || 0) > 0 && !GW[d.wid].n) open = true; }
  return { w, open };
}
// 약점 점수: 모의고사 오답 > 게임 오답 > 교재 표시. 연속으로 맞히면 내려간다
function weakScore(d) {
  const r = store.rec[d.id], p = pastWrong(d);
  return 3 * r.w + 2 * p.w + (p.open ? 3 : 0) + (d.hard ? 0.8 : 0) - 2.5 * r.s;
}

/* ============ 도우미 ============ */
const app = document.getElementById('app');
const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEYS = ['①', '②', '③', '④', '⑤'];
const SRC = d => d.t === 's' ? `성어 · ${d.pg}쪽` : `어휘 · ${d.sec}`;

// 뜻이 비슷할수록 높은 점수 (글자 두 개 묶음 겹침)
const BI = new Map();
function bigrams(s) {
  if (BI.has(s)) return BI.get(s);
  const t = s.replace(/[^가-힣一-龥]/g, ''), set = new Set();
  for (let i = 0; i < t.length - 1; i++) set.add(t.slice(i, i + 2));
  BI.set(s, set); return set;
}
function sim(a, b) {
  const A = bigrams(a), B = bigrams(b); if (!A.size || !B.size) return 0;
  let n = 0; A.forEach(x => { if (B.has(x)) n++; }); return n / Math.sqrt(A.size * B.size);
}
// 헷갈리는 보기 고르기: 같은 묶음 → 뜻이 비슷한 것 순. 같은 성어(다른 쪽 중복)·같은 뜻은 뺀다
function rivals(d, n) {
  const pool = D.filter(x => x.t === d.t && x.id !== d.id && x.ko !== d.ko && x.m !== d.m);
  const scored = pool.map(x => ({ x, k: (x.g === d.g ? 1.2 : 0) + sim(x.m, d.m) + Math.random() * 0.35 }))
    .sort((a, b) => b.k - a.k);
  const out = [], seenM = new Set([d.m]), seenK = new Set([d.ko]);
  for (const { x } of scored) {
    if (out.length >= n) break;
    if (seenM.has(x.m) || seenK.has(x.ko)) continue;
    seenM.add(x.m); seenK.add(x.ko); out.push(x);
  }
  return out;
}

/* ============ 문항 만들기 ============ */
// 유형: mean(뜻 고르기) · pick(뜻 보고 고르기) · lit(풀이 보고 성어) · odd(바르지 않은 짝) · fill(예문 빈칸)
function blankOf(d) {
  if (!d.ex || !d.ex.includes(d.ko)) return null;
  return d.ex.split(d.ko);
}
function typesFor(d) {
  const t = ['mean', 'mean', 'pick', 'pick', 'odd'];
  if (d.t === 's' && d.lit) t.push('lit');
  if (d.t === 'w' && blankOf(d)) t.push('fill', 'fill');
  return t;
}
function makeQ(d, type) {
  const rv = rivals(d, 5);
  const opts = shuffle([d, ...rv.slice(0, 4)]);
  const q = { d, type, opts, ans: opts.indexOf(d) };
  if (type === 'odd') {
    // 다섯 짝 중 d의 뜻만 보기에 없는 비슷한 성어의 뜻으로 바꿔 놓는다 → d를 골라야 정답
    const fake = rv[4] || rv[0];
    q.pairs = opts.map(x => ({ x, m: x === d ? fake.m : x.m }));
    q.fake = fake;
  }
  return q;
}
// 실전: 성어 15 + 어휘 10, 각각 틀렸던 것 위주
const realExam = () => shuffle(buildExam(D.filter(d => d.t === 's'), 15, true).concat(buildExam(D.filter(d => d.t === 'w'), 10, true)));
function buildExam(pool, n, weighted) {
  let pick;
  if (weighted) {
    const ranked = pool.map(d => ({ d, k: weakScore(d) + Math.random() * 2 })).sort((a, b) => b.k - a.k);
    const hot = ranked.filter(r => r.k > 1.5).slice(0, Math.round(n * 0.72)).map(r => r.d);
    const rest = shuffle(pool.filter(d => !hot.includes(d)));
    pick = hot.concat(rest.slice(0, n - hot.length));
  } else pick = shuffle(pool.slice()).slice(0, n);
  return shuffle(pick).map(d => { const ts = typesFor(d); return makeQ(d, ts[(Math.random() * ts.length) | 0]); });
}

/* ============ 시험 ============ */
let X = null;
function startExam(mode, qs) {
  if (!qs.length) return;
  X = { mode, qs, idx: 0, right: 0, combo: 0, best: 0, wrong: [], t0: Date.now(), locked: false };
  renderQ();
}
function stemOf(q) {
  const d = q.d, word = d.t === 's' ? '성어' : '단어';
  switch (q.type) {
    case 'mean': return { s: `다음 ${word}의 뜻으로 가장 알맞은 것은?`, box: `<span class="big">${esc(d.ko)}</span><span class="hj">${esc(d.hj)}</span>` };
    case 'pick': return { s: `다음 뜻을 가진 ${word}로 가장 알맞은 것은?`, box: esc(d.m) };
    case 'lit': return { s: `글자 그대로 풀면 다음과 같은 성어는?`, box: esc(d.lit) };
    case 'fill': { const p = blankOf(d); return { s: `빈칸에 들어갈 단어로 가장 알맞은 것은?`, box: p.map(esc).join('<span class="blank">□□</span>') }; }
    case 'odd': return { s: `${word}와 뜻풀이의 짝이 <u>바르지 않은</u> 것은?`, box: null };
  }
}
function optHTML(q, x, n) {
  if (q.type === 'mean') return esc(x.m);
  if (q.type === 'odd') return `<b>${esc(x.ko)}</b><span class="oh">(${esc(x.hj)})</span> — ${esc(q.pairs[n].m)}`;
  return `<b>${esc(x.ko)}</b> <span class="oh">(${esc(x.hj)})</span>`;
}
function renderQ() {
  const q = X.qs[X.idx], d = q.d, st = stemOf(q);
  X.locked = false;
  const score = X.right * PTS;
  app.innerHTML = '';
  app.append($(`
    <div>
      <div class="top">
        <button class="iconbtn" id="quit" aria-label="그만두기">✕</button>
        <div class="brand" style="font-size:17px">${esc(X.mode)} 모의고사</div>
        <span class="combo ${X.combo >= 2 ? 'on' : ''}" id="combo">${X.combo}콤보</span>
      </div>
      <div class="hud"><span><b>${X.idx + 1}</b> / ${X.qs.length}</span><span class="sp"></span><span>점수 <b class="mono">${score}</b></span></div>
      <div class="prog"><i style="width:${Math.round(X.idx / X.qs.length * 100)}%"></i></div>
      <div class="paper" id="paper">
        <div class="qhead"><span class="qno">${X.idx + 1}.</span><span class="src ${d.t}">${d.t === 's' ? '성어' : '어휘'}</span><span class="pt">[${PTS}점]</span></div>
        <div class="stem">${st.s}</div>
        ${st.box ? `<div class="box">${st.box}</div>` : ''}
        <div class="opts" id="opts"></div>
      </div>
      <div id="after"></div>
    </div>`));
  const box = document.getElementById('opts');
  q.opts.forEach((x, n) => {
    const b = $(`<button class="opt"><span class="k">${KEYS[n]}</span><span>${optHTML(q, x, n)}</span></button>`);
    b.onclick = () => answer(n, b); box.append(b);
  });
  document.getElementById('quit').onclick = () => { if (confirm('시험을 그만둘까요? 푼 문항 기록은 남아요.')) { X = null; screenHome(); } };
}
function floatText(t) { const el = $(`<div class="floatup">${esc(t)}</div>`); document.body.append(el); setTimeout(() => el.remove(), 900); }
function explainHTML(q, ok) {
  const d = q.d, rows = [];
  if (d.ch) rows.push(['훈음', `<span class="hj">${esc(d.ch)}</span>`]);
  if (d.lit) rows.push(['풀이', esc(d.lit)]);
  rows.push(['뜻', esc(d.m)]);
  if (d.ex) rows.push(['예문', esc(d.ex)]);
  let extra = '';
  if (q.type === 'odd') extra = `<div class="rw"><span class="lb">함정</span><span>보기의 뜻풀이는 <b>${esc(q.fake.ko)}</b>의 뜻이에요</span></div>`;
  return `<div class="explain ${ok ? '' : 'bad'}">
    <div class="h">${ok ? '정답!' : '오답 — 정답은 ' + KEYS[q.ans]} · ${esc(d.ko)} <span class="hj">${esc(d.hj)}</span></div>
    ${rows.map(([l, v]) => `<div class="rw"><span class="lb">${l}</span><span>${v}</span></div>`).join('')}${extra}
    <div class="rw"><span class="lb">출처</span><span style="color:var(--ink-3)">${esc(SRC(d))}</span></div></div>`;
}
function answer(n, btn) {
  if (!X || X.locked) return;
  X.locked = true;
  const q = X.qs[X.idx], ok = n === q.ans, r = store.rec[q.d.id];
  r.a++;
  if (ok) { r.s++; X.right++; X.combo++; X.best = Math.max(X.best, X.combo); }
  else { r.w++; r.s = 0; X.combo = 0; X.wrong.push(q); }
  save();
  if (ok) { X.combo >= 2 ? comboTone(X.combo) : dingdong(); if (X.combo >= 3) floatText(`${X.combo}연속!`); } else ttaeng();
  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim');
  });
  document.getElementById('paper').classList.add(ok ? 'pop' : 'shake');
  const cb = document.getElementById('combo'); cb.textContent = `${X.combo}콤보`; cb.classList.toggle('on', X.combo >= 2);
  const after = document.getElementById('after');
  after.append($(explainHTML(q, ok)));
  const nx = $(`<button class="btn" style="margin-top:14px">${X.idx + 1 < X.qs.length ? '다음 문항' : '채점 결과 보기'}</button>`);
  nx.onclick = () => { X.idx++; X.idx < X.qs.length ? renderQ() : screenResult(); };
  after.append(nx);
  nx.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ============ 결과 ============ */
function gradeOf(p) { return p >= 92 ? 1 : p >= 84 ? 2 : p >= 76 ? 3 : p >= 68 ? 4 : p >= 60 ? 5 : p >= 52 ? 6 : p >= 44 ? 7 : p >= 36 ? 8 : 9; }

  X.wrong.forEach(q => byType[q.type][0]++);
  store.hist.push({ t: Date.now(), mode: X.mode, n, right: X.right, score: pct, pct, sec: Math.round((Date.now() - X.t0) / 1000), types: byType,

/* ============ 아빠에게 보내기 ============ */
const TYPE_NAME = { mean: '뜻 고르기', pick: '뜻 보고 고르기', lit: '풀이 보고 성어', odd: '바르지 않은 짝', fill: '예문 빈칸' };
function reportText() {

  const avg = Math.round(H.reduce((s, h) => s + h.pct, 0) / H.length);

  });
  const T = {};
  H.forEach(h => Object.entries(h.types || {}).forEach(([k, [w, n]]) => { T[k] = T[k] || [0, 0]; T[k][0] += w; T[k][1] += n; }));
  L.push('');
  L.push('■ 문항 유형별 정답률');
  Object.entries(T).sort((a, b) => (a[1][1] - a[1][0]) / a[1][1] - (b[1][1] - b[1][0]) / b[1][1])
    .forEach(([k, [w, n]]) => L.push(`  ${TYPE_NAME[k]} — ${Math.round((n - w) / n * 100)}% (${n - w}/${n})`));
  const S = D.filter(d => d.t === 's'), W = D.filter(d => d.t === 'w');
  const acc = list => { const a = list.reduce((s, d) => s + store.rec[d.id].a, 0), w = list.reduce((s, d) => s + store.rec[d.id].w, 0); return a ? `${Math.round((a - w) / a * 100)}% (${a - w}/${a})` : '–'; };
  L.push(`  성어 ${acc(S)} · 어휘 ${acc(W)}`);
  const miss = D.filter(d => store.rec[d.id].w > 0).sort((a, b) => store.rec[b.id].w - store.rec[a.id].w || store.rec[a.id].s - store.rec[b.id].s);
  L.push('');
  L.push(`■ 모의고사에서 틀린 것 ${miss.length}개 (틀린 횟수 · 지금 연속 정답)`);
  miss.slice(0, 40).forEach((d, n) => L.push(`  ${n + 1}) ${d.ko}(${d.hj}) ✕${store.rec[d.id].w} · 연속 ${store.rec[d.id].s} — ${SRC(d)}`));
  if (miss.length > 40) L.push(`  … 외 ${miss.length - 40}개`);
  return L.join('\n');
}
async function shareReport(btn) {
  const txt = reportText(), label = btn ? btn.textContent : '';
  try { if (navigator.share) { await navigator.share({ title: '국어 뜻 모의고사 결과', text: txt }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt);
    if (btn) { btn.textContent = '복사했어요 · 카톡에 붙여넣기'; setTimeout(() => btn.textContent = label, 2500); } return; } catch (e) { }
  const ta = $(`<textarea style="width:100%;height:240px;font-size:12px;font-family:monospace;margin-top:10px;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)"></textarea>`);
  ta.value = txt; (btn || app.lastElementChild).after(ta); ta.select();
}

screenHome();
